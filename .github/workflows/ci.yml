name: CI
on:
  pull_request:
  push:
    branches: [main]

# The runners set no UTF-8 locale, so Ruby would read the theme files as
# US-ASCII and choke on the non-ASCII characters they contain.
env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  test:
    name: Tests
    runs-on: ubuntu-slim

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Ruby
        uses: spinel-coop/setup-rv@main
        with:
          ruby-version: current

      - name: Run tests
        run: ruby test/generate_themes_test.rb

  generated_files_current:
    name: Generated files match themes.yml
    runs-on: ubuntu-slim

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Ruby
        uses: spinel-coop/setup-rv@main
        with:
          ruby-version: current

      - name: Regenerate application themes
        run: ruby generate_themes.rb

      - name: Fail if regenerating changed a committed file
        run: git diff --exit-code
